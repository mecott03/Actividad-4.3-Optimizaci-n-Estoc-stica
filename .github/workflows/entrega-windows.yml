name: Entrega final Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.py'
      - requirements.txt
      - resultados/**
      - graficas/**
      - .github/workflows/entrega-windows.yml

permissions:
  contents: write

jobs:
  compilar-y-verificar:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Instalar herramientas de compilación
        run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Validar algoritmo y los 18 experimentos originales
        run: python -m unittest discover -s tests -v
      - name: Compilar ejecutable autónomo sin consola
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --noupx --name Caminata_Aleatoria --collect-all matplotlib main.py
      - name: Probar binario trasladado con PATH sin Python
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'Otra ubicación con espacios'
          $testDir = Join-Path $env:RUNNER_TEMP 'evidencia-windows'
          New-Item -ItemType Directory -Force $work, $testDir | Out-Null
          $exe = Join-Path $work 'Caminata_Aleatoria.exe'
          Copy-Item dist/Caminata_Aleatoria.exe $exe
          $oldPath = $env:PATH
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Get-ChildItem Env: | Where-Object { $_.Name -like 'PYTHON*' -or $_.Name -in @('VIRTUAL_ENV','TCL_LIBRARY','TK_LIBRARY') } | ForEach-Object { Remove-Item "Env:$($_.Name)" }
          try {
            $p = Start-Process -FilePath $exe -ArgumentList @('--verificar-ejecutable', "`"$testDir`"") -WorkingDirectory $work -PassThru
            if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'El ejecutable no terminó su prueba' }
            if ($p.ExitCode -ne 0) { throw "La prueba del ejecutable falló: $($p.ExitCode)" }
            $report = Get-Content (Join-Path $testDir 'verificacion_windows.json') -Raw | ConvertFrom-Json
            if (-not $report.correcto -or -not $report.compilado -or $report.plataforma -ne 'Windows') { throw 'Evidencia inválida' }
            Get-Content (Join-Path $testDir 'verificacion_windows.json')
          } finally { $env:PATH = $oldPath }
      - name: Crear carpeta y ZIP final
        shell: pwsh
        run: |
          python preparar_entrega.py --exe dist/Caminata_Aleatoria.exe --evidencia "$env:RUNNER_TEMP/evidencia-windows/verificacion_windows.json" --salida paquete
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publicar ZIP descargable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "entrega-windows-${{ github.run_number }}" "paquete/ENTREGA_ACTIVIDAD_4.3.zip" --target "${{ github.sha }}" --title "Entrega Windows verificada · ${{ github.run_number }}" --notes "Ejecutable autónomo compilado y probado en windows-latest. Incluye código fuente, resultados originales y gráficas. Extrae el ZIP y abre Caminata_Aleatoria.exe. No requiere instalar Python."
      - name: Guardar ZIP como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ENTREGA_ACTIVIDAD_4.3
          path: paquete/ENTREGA_ACTIVIDAD_4.3.zip
          if-no-files-found: warn
          retention-days: 90
      - name: Guardar evidencia de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verificacion-windows
          path: ${{ runner.temp }}/evidencia-windows/
          if-no-files-found: warn
